name: Agent terminal validation

on:
  push:
    branches:
      - "jolly/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling dependencies
        run: python -m pip install -r requirements-tooling.txt
      - name: Self-test terminal evidence capture
        run: >-
          python -m tools.agent_terminal.verify self-test
          --report .agent-validation/reports/self-test-${{ runner.os }}.json
      - name: Verify Windows PowerShell 5.1 UTF-8 BOM and parsing
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'tools/base_mod/run_independent_alpha_update.ps1',
            'tools/base_mod/independent_alpha_20261009/INSTALL-ALPHA.ps1'
          )
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path)) {
              if ($path -like '*/INSTALL-ALPHA.ps1') { continue }
              throw "Required PowerShell source missing: $path"
            }
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $path))
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or
                $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
              throw "Windows PowerShell 5.1 requires UTF8 BOM in $path"
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path).Path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.ToString() }
              throw "Windows PowerShell 5.1 parsing failed for $path"
            }
            Write-Host "Windows PowerShell 5.1 syntax PASS: $path"
          }
      - name: Ensure deterministic JDK 17 on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Regression – no JAVA_HOME, with and without LOCALAPPDATA
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $savedJava = $env:JAVA_HOME
          $savedLocal = $env:LOCALAPPDATA
          try {
            $env:JAVA_HOME = $null
            . .\tools\base_mod\resolve_java_keytool.ps1
            $found = Resolve-JavaKeytool
            if (-not (Test-Path -LiteralPath $found -PathType Leaf)) {
              throw "Resolved a missing keytool executable: $found"
            }
            Write-Host "PASS: JAVA_HOME unset resolves: $found"
            $env:LOCALAPPDATA = $null
            $foundAgain = Resolve-JavaKeytool
            if (-not (Test-Path -LiteralPath $foundAgain -PathType Leaf)) {
              throw "LOCALAPPDATA fallback did not resolve keytool"
            }
            Write-Host "PASS: JAVA_HOME and LOCALAPPDATA unset"
          } finally {
            $env:JAVA_HOME = $savedJava
            $env:LOCALAPPDATA = $savedLocal
          }
      - name: Run committed validation plan
        run: >-
          python -m tools.agent_terminal.verify plan .agent-validation/plan.json
          --report .agent-validation/reports/plan-${{ runner.os }}.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-terminal-${{ runner.os }}
          path: .agent-validation/reports/
          retention-days: 14
          if-no-files-found: warn
