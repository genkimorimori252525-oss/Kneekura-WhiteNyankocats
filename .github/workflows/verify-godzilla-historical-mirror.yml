name: Verify recovered Godzilla historical source (ephemeral)

on:
  workflow_dispatch:
  push:
    branches:
      - "jolly/**"
    paths:
      - ".github/workflows/verify-godzilla-historical-mirror.yml"
      - "tools/base_mod/verify_godzilla_historical_mirror.py"

permissions:
  contents: read

concurrency:
  group: godzilla-ephemeral-mirror
  cancel-in-progress: true

jobs:
  verify-public-historical-godzilla:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only existing local decoder dependencies
        run: python -m pip install -r requirements-tooling.txt
      - name: Download exact historical files into volatile OS tmp, verify and destroy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-validation/reports
          # No APK, SAVE, user asset, account or device enters this runner.
          # Only the pinned, publicly archived historical 4 source files
          # are temporarily downloaded and MD5-checked against JP15.7.1.
          # The Python tool deletes ALL original/derived binaries and images
          # from OS tmp BEFORE it reports sanitized metadata in the checkout.
          python -m tools.base_mod.verify_godzilla_historical_mirror \
            --allow-historical-mirror-download \
            --metadata-output .agent-validation/reports/godzilla-real-mirror-metadata.json
      - name: Publish METADATA-ONLY proof (never copyrighted game bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godzilla-jp1571-historical-mirror-METADATA-ONLY
          path: .agent-validation/reports/godzilla-real-mirror-metadata.json
          if-no-files-found: warn
          retention-days: 3
