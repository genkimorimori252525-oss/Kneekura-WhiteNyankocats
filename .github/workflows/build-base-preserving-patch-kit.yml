name: Build base-preserving patch kit

on:
  push:
    branches:
      - "jolly/**"
    paths:
      - "tools/base_mod/**"
      - "native/kneekura-shim/**"
      - "docs/architecture/base-preserving-boot-smoke.md"
      - "docs/architecture/package-flavor-contract.md"
      - "docs/architecture/design-philosophy.md"
      - "requirements-patching.txt"
      - ".github/workflows/build-base-preserving-patch-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install patching dependencies
        run: python -m pip install -r requirements-patching.txt

      - name: Install NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "ndk;27.2.12479018"

      - name: Build inert ARM64 shim
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S native/kneekura-shim -B build/shim \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/shim --parallel

      - name: Assemble source-free local build kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/patch-kit/tools/base_mod
          mkdir -p build/patch-kit/docs/architecture
          cp -a tools/base_mod/*.py build/patch-kit/tools/base_mod/
          cp requirements-patching.txt build/patch-kit/
          cp build/shim/libkneekura.so build/patch-kit/
          cp docs/architecture/base-preserving-boot-smoke.md build/patch-kit/docs/architecture/
          cp docs/architecture/package-flavor-contract.md build/patch-kit/docs/architecture/
          cp docs/architecture/design-philosophy.md build/patch-kit/docs/architecture/
          cat > build/patch-kit/README-FIRST.txt <<'EOF'
          Kneekura base-preserving JP 15.7.1 patch kit

          This artifact contains NO Battle Cats APK or proprietary game payload.
          Supply your own exact nyanko_battlecats_2026-10-06.zip.

          Prerequisites on the build PC:
            - Python 3.12+
            - Java 17 / keytool
            - Android SDK build-tools (zipalign + apksigner)
            - pip install -r requirements-patching.txt

          Generate a stable local signing key ONCE:
            python -m tools.base_mod.keygen private/kneekura.p12 --storepass YOUR_PASSWORD

          Personal MAX boot smoke:
            python -m tools.base_mod.build_owned_boot_smoke \
              /path/to/nyanko_battlecats_2026-10-06.zip \
              --flavor personal \
              --shim libkneekura.so \
              --keystore private/kneekura.p12 \
              --alias kneekura \
              --storepass YOUR_PASSWORD \
              --output out

          Practice Clean boot smoke: change --flavor personal to --flavor practice.

          The generated signed-splits directory includes INSTALL-SMOKE.txt and
          parity-report.json.  Do not proceed to gameplay-feature patches unless
          static parity passes and the original MyActivity boots on the device.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: kneekura-base-preserving-jp15.7.1-patch-kit
          path: build/patch-kit/
          if-no-files-found: error
          retention-days: 30