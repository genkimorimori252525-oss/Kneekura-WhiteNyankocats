name: Probe draft release access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe asset with gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api             -H "Accept: application/octet-stream"             -H "X-GitHub-Api-Version: 2022-11-28"             "repos/$GITHUB_REPOSITORY/releases/assets/614397353"             > asset.zip
          sha256sum asset.zip
          stat -c "%s" asset.zip
