name: Build base-preserving boot smoke

on:
  push:
    branches:
      - "jolly/**"
    paths:
      - "tools/base_mod/extract_owned_splits.py"
      - "tools/base_mod/package_flavor.py"
      - "tools/base_mod/inject_shim.py"
      - "tools/base_mod/repack.py"
      - "tools/base_mod/verify_parity.py"
      - "native/kneekura-shim/**"
      - "requirements-patching.txt"
      - ".github/workflows/build-base-preserving-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [personal, practice]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install patching dependencies
        run: python -m pip install -r requirements-patching.txt

      - name: Install Android build tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Download exact user-owned draft-release export
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: "614397353"
          EXPECTED_SHA256: "38c3bbb8d2cf2101793c9462617d4293e19fc99588b6655fd40299fd61a0ef56"
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/octet-stream"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"             -o build/android-export.zip
          actual="$(sha256sum build/android-export.zip | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"

      - name: Extract exact split set
        run: |
          python -m tools.base_mod.extract_owned_splits             build/android-export.zip             --output build/original-splits

      - name: Build inert ARM64 shim
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S native/kneekura-shim -B build/shim             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-29             -DCMAKE_BUILD_TYPE=Release
          cmake --build build/shim --parallel

      - name: Inject inert bootstrap into exact original
        run: |
          python -m tools.base_mod.inject_shim             build/original-splits             --shim build/shim/libkneekura.so             --output build/bootstrap-splits

      - name: Apply isolated package flavor
        run: |
          python -m tools.base_mod.package_flavor             build/bootstrap-splits             --flavor "${{ matrix.flavor }}"             --output build/flavored-splits

      - name: Generate disposable smoke-test signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair             -keystore build/smoke-test.p12             -storetype PKCS12             -alias kneekura-smoke             -keyalg RSA             -keysize 3072             -validity 30             -dname "CN=Kneekura Smoke Test, OU=Disposable CI, O=Kneekura, C=JP"             -storepass kneekura-smoke-only             -keypass kneekura-smoke-only

      - name: Align and sign all six splits
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.base_mod.repack             build/flavored-splits             --output build/signed-splits             --keystore build/smoke-test.p12             --alias kneekura-smoke             --storepass kneekura-smoke-only             --source-export-sha256 38c3bbb8d2cf2101793c9462617d4293e19fc99588b6655fd40299fd61a0ef56

      - name: Verify static preservation parity
        run: |
          python -m tools.base_mod.verify_parity             build/original-splits             build/signed-splits             --flavor "${{ matrix.flavor }}"             --output build/parity-report.json

      - name: Verify signed APK package and launcher
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging build/signed-splits/base.apk | tee build/base-badging.txt
          for apk in build/signed-splits/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" >> build/signing-report.txt
          done

      - name: Add install smoke instructions
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.flavor }}" in
            personal) PACKAGE="jp.kn.white.battlecats" ;;
            practice) PACKAGE="jp.kn.clean.battlecats" ;;
          esac
          cat > build/signed-splits/INSTALL-SMOKE.txt <<EOF
          Kneekura JP 15.7.1 base-preserving boot smoke
          Flavor: ${{ matrix.flavor }}
          Package: $PACKAGE
          Launcher class: jp.co.ponos.battlecats.MyActivity

          This build uses a disposable CI signing key.
          A later smoke build will require uninstall/reinstall.

          Install all six split APKs together:
            adb install-multiple -r *.apk

          Launch the original Battle Cats activity:
            adb shell am start -n $PACKAGE/jp.co.ponos.battlecats.MyActivity

          Required checks:
          1. Original Battle Cats boot/logo/base screen appears.
          2. No Kneekura verification-harness screen appears.
          3. Navigate original base/unit/stage screens.
          4. Enter one original stage and return.
          5. Put device in airplane mode and repeat boot/navigation.
          6. Record crash/logcat if any step fails.

          Feature mask is 0 in this artifact: no Super Kneekura Gacha,
          login bonus, MAX profile, or stage reward hooks are active yet.
          EOF
          cp build/parity-report.json build/signed-splits/parity-report.json
          cp build/original-splits/source-split-ledger.json build/signed-splits/source-split-ledger.json

      - uses: actions/upload-artifact@v4
        with:
          name: kneekura-${{ matrix.flavor }}-base-preserving-boot-smoke
          path: build/signed-splits/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: kneekura-${{ matrix.flavor }}-smoke-reports
          path: |
            build/parity-report.json
            build/base-badging.txt
            build/signing-report.txt
            build/bootstrap-splits/bootstrap-patch-ledger.json
            build/flavored-splits/package-patch-ledger.json
            build/signed-splits/patch-ledger.json
          if-no-files-found: error
          retention-days: 30