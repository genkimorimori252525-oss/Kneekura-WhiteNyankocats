name: Probe public BCData server manifests

on:
  push:
    branches:
      - "jolly/foundation-tooling-2026-10-06"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pycryptodome
      - name: Scan jp_server manifests
        run: |
          python - <<'PY'
          import hashlib, re, urllib.request
          from Crypto.Cipher import AES

          target_ids = {
              289:"Madoka", 290:"Homura", 363:"Saber",
              403:"Eva403",404:"Eva404",405:"Eva405",406:"Eva406",
              407:"Eva407",408:"Eva408",409:"Eva409",410:"Eva410",
              411:"Eva411",412:"Eva412",413:"Eva413",414:"Eva414",
              415:"Eva415",488:"Eva488",511:"StreetFighter511",
              536:"Miku536",552:"Eva552",597:"Ranma597",
              704:"Eva704",711:"Eva711",815:"Eva815"
          }
          families = (
              ["ImageServer","UnitServer","NumberServer","MapServer","WImageDataServer"] +
              [f"{c}{kind}Server" for c in "ABCDEFGHIJKLMNOPQRSTUV"
               for kind in ("Image","Unit","Number","Map")]
          )

          key = hashlib.md5(b"pack").digest()[:8].hex().encode("ascii")
          cipher = AES.new(key, AES.MODE_ECB)

          def unpad(data):
              n=data[-1]
              return data[:-n]

          def fetch(family):
              url=f"https://raw.githubusercontent.com/fieryhenry/BCData/main/jp_server/{family}.list"
              try:
                  return urllib.request.urlopen(url, timeout=30).read()
              except Exception:
                  return None

          all_entries=[]
          family_counts={}
          for fam in families:
              raw=fetch(fam)
              if raw is None:
                  continue
              dec=unpad(cipher.decrypt(raw)).decode("utf-8-sig","replace")
              lines=[x for x in dec.splitlines() if x]
              try:
                  declared=int(lines[0].strip())
              except Exception:
                  continue
              names=[line.split(",",1)[0] for line in lines[1:]]
              family_counts[fam]=(declared,len(names))
              for name in names:
                  all_entries.append((fam,name))

          print("MANIFEST_FAMILIES",len(family_counts))
          print("TOTAL_ENTRIES",len(all_entries))

          # Search every target by common zero-padded and plain ID representations.
          for uid,label in target_ids.items():
              pats=[
                  re.compile(rf"(?<!\d)0*{uid}(?!\d)",re.I),
                  re.compile(rf"(^|[_\-/])0*{uid}([_\-.]|$)",re.I),
              ]
              hits=[(fam,name) for fam,name in all_entries if any(p.search(name) for p in pats)]
              print(f"TARGET {uid} {label} HITS {len(hits)}")
              for fam,name in hits[:80]:
                  print(" ",fam,name)

          # Also expose examples of animation/model asset extensions in server manifests.
          anim=[(fam,name) for fam,name in all_entries if name.lower().endswith((".maanim",".mamodel",".imgcut",".png"))]
          print("ANIM_VISUAL_ENTRIES",len(anim))
          for fam,name in anim[:80]:
              print(" ASSET",fam,name)
          PY
